Hostname=CPE-Default
AllowRoot=1
Server=zabbix.switch-net.com
ServerActive=zabbix.switch-net.com
LogFile=/tmp/zabbix_agentd.log
LogFileSize=1
AllowKey=system.run[*]
StartAgents=1
Timeout=10
BufferSend=5
BufferSize=100

UserParameter=ping.loss[*],fping -q -c 10 -p 1000 -t 2000 $1 2>&1 | sed -n 's/.*%loss = [0-9]\{1,3\}\/[0-9]\{1,3\}\/\([0-9]\{1,3\}\)%.*/\1/p' || echo 100
UserParameter=ping.delay[*],fping -q -c 10 -p 1000 -t 2000 $1 2>&1 | sed -n 's/.*min\/avg\/max = [0-9.]\{1,\}\/\([0-9.]\{1,\}\)\/.*/\1/p' || echo 0

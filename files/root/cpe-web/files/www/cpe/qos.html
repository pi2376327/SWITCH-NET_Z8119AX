<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/cpe/assets/favicon.png">
    <title>带宽限制</title>
    <style>
        :root { --bg-main:#f3f6fb; --bg-card:#fff; --border-color:#dfe7f3; --text-main:#071b3a; --text-muted:#64748b; --theme-blue:#3568b7; --theme-green:#18a178; --theme-red:#d94a38; }
        body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg-main); color:var(--text-main); padding:30px; margin:0; }
        .container { max-width:980px; margin:0 auto; }
        h1 { margin:0 0 24px; font-size:1.8rem; }
        .card { background:var(--bg-card); border:1px solid var(--border-color); border-radius:12px; padding:24px; box-shadow:0 12px 30px rgba(29,53,87,.08); }
        .form-grid { display:grid; grid-template-columns:repeat(3,minmax(180px,1fr)); gap:18px; align-items:end; }
        .form-group { display:flex; flex-direction:column; gap:8px; }
        label { color:var(--text-muted); font-size:.9rem; font-weight:600; }
        input, select { background:#fff; border:1px solid var(--border-color); color:var(--text-main); padding:10px; border-radius:6px; box-sizing:border-box; font-size:.95rem; }
        input:focus, select:focus { border-color:var(--theme-blue); outline:none; }
        .hint { color:var(--text-muted); margin:14px 0 0; line-height:1.7; }
        .tun-hint { color:var(--theme-green); margin:14px 0 0; font-weight:800; }
        .actions { display:flex; justify-content:flex-end; margin-top:24px; }
        button { background:var(--theme-blue); color:#fff; border:0; padding:10px 24px; border-radius:6px; cursor:pointer; font-weight:800; }
        .toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#fff; color:#13BB8A; padding:12px 20px; border:1px solid #b9eadb; border-radius:8px; box-shadow:0 14px 34px rgba(15,65,55,.18); opacity:0; pointer-events:none; font-weight:800; z-index:1001; transition:opacity .3s ease; }
        .toast.show { opacity:1; }
        .page-lock { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(3,7,18,.64); z-index:1000; }
        .page-lock.active { display:flex; }
        .page-lock-box { min-width:140px; padding:18px 24px; text-align:center; background:#fff; border:1px solid var(--border-color); border-radius:8px; box-shadow:0 18px 42px rgba(0,0,0,.35); font-weight:800; }
        @media (max-width:760px) { .form-grid { grid-template-columns:1fr; } }
    </style>
</head>
<body>
    <div id="toast" class="toast">配置已保存并应用</div>
    <div id="pageLock" class="page-lock"><div class="page-lock-box">请稍后</div></div>
    <div class="container">
        <h1>带宽限制</h1>
        <div class="card">
            <div class="form-grid">
                <div class="form-group">
                    <label>启用限速</label>
                    <select id="enabled">
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>下载限速(kbit/s)</label>
                    <input type="number" id="download" min="1" step="1" placeholder="10240">
                </div>
                <div class="form-group">
                    <label>上传限速(kbit/s)</label>
                    <input type="number" id="upload" min="1" step="1" placeholder="10240">
                </div>
            </div>
            <p class="hint">该配置作用于所有 tun 接口共享限速池，下载方向使用 ifb0，上传方向使用 ifb1。保存后会自动重启 QoS 服务生效。</p>
            <p id="tunHint" class="tun-hint">当前共享限速接口：加载中...</p>
            <div class="actions"><button onclick="saveQos()">保存 & 应用</button></div>
        </div>
    </div>
    <script>
        const rawFetch = window.fetch.bind(window);
        window.fetch = (url, opts = {}) => {
            const token = localStorage.getItem("cpe_token");
            opts.headers = Object.assign({}, opts.headers || {}, token ? {"X-CPE-Token": token} : {});
            if (token && typeof url === 'string' && url.indexOf('/cgi-bin/') === 0 && url.indexOf('_cpe_token=') === -1) {
                url += (url.indexOf('?') === -1 ? '?' : '&') + '_cpe_token=' + encodeURIComponent(token);
            }
            return rawFetch(url, opts);
        };
        if (localStorage.getItem("cpe_role") !== "admin") {
            document.body.innerHTML = "<h2 style='text-align:center;margin-top:50px;'>无权限访问</h2>";
            throw new Error("Auth err");
        }
        init();
        async function init() {
            const res = await fetch('/cgi-bin/cpe_api.sh?action=get_qos');
            const json = await res.json();
            if (json.msg === 'unauthorized') return handleSessionExpired();
            if (json.status === 'ok') {
                document.getElementById('enabled').value = json.enabled || '1';
                document.getElementById('download').value = json.download || '10240';
                document.getElementById('upload').value = json.upload || '10240';
                const tuns = (json.tuns || '').trim();
                document.getElementById('tunHint').textContent = '当前共享限速接口：' + (tuns || '暂无已挂载 tun 接口');
            }
        }
        async function saveQos() {
            const enabled = document.getElementById('enabled').value;
            const download = document.getElementById('download').value.trim();
            const upload = document.getElementById('upload').value.trim();
            if (!/^[0-9]+$/.test(download) || !/^[0-9]+$/.test(upload) || Number(download) < 1 || Number(upload) < 1) {
                alert('下载和上传限速必须为大于 0 的整数');
                return;
            }
            setBusy(true, '请稍后');
            try {
                const body = `enabled=${encodeURIComponent(enabled)}&download=${encodeURIComponent(download)}&upload=${encodeURIComponent(upload)}`;
                const res = await fetch('/cgi-bin/cpe_api.sh?action=set_qos', { method:'POST', body });
                const json = await res.json();
                if (json.status === 'ok') showToast('带宽限制已保存并应用');
                else alert(json.msg || '保存失败');
            } finally {
                setBusy(false);
            }
        }
        function handleSessionExpired() {
            alert('请重新登录');
            localStorage.removeItem('cpe_auth');
            localStorage.removeItem('cpe_role');
            localStorage.removeItem('cpe_token');
            window.top.location.reload();
        }
        function setBusy(active, text) {
            const lock = document.getElementById('pageLock');
            if (text) lock.querySelector('.page-lock-box').textContent = text;
            lock.classList.toggle('active', !!active);
        }
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg || '配置已保存并应用';
            t.classList.add('show');
            clearTimeout(showToast.timer);
            showToast.timer = setTimeout(() => t.classList.remove('show'), 2200);
        }
    </script>
</body>
</html>

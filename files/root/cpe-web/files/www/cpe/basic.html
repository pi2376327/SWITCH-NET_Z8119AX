<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/cpe/assets/favicon.png">
    <title>基础配置</title>
    <style>
        :root { --bg-main:#f3f6fb; --bg-card:#fff; --border-color:#dfe7f3; --text-main:#071b3a; --text-muted:#64748b; --theme-blue:#3568b7; --theme-green:#18a178; --theme-red:#d94a38; }
        body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg-main); color:var(--text-main); padding:30px; margin:0; }
        .container { max-width:none; width:100%; margin:0 auto; }
        h1 { margin:0 0 24px; font-size:1.8rem; }
        .stack { display:flex; flex-direction:column; gap:22px; }
        .card { background:var(--bg-card); border:1px solid var(--border-color); border-radius:12px; padding:24px; box-shadow:0 12px 30px rgba(29,53,87,.08); }
        .card-header { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:20px; border-bottom:1px solid var(--border-color); padding-bottom:15px; }
        h2 { margin:0; color:var(--theme-blue); font-size:1.2rem; }
        .form-grid { display:grid; grid-template-columns:repeat(3,minmax(180px,1fr)); gap:16px; align-items:end; }
        .form-group { display:flex; flex-direction:column; gap:8px; }
        label { color:var(--text-muted); font-size:.9rem; font-weight:600; }
        input { background:#fff; border:1px solid var(--border-color); color:var(--text-main); padding:10px; border-radius:6px; box-sizing:border-box; font-size:.95rem; }
        input:focus { border-color:var(--theme-blue); outline:none; }
        button { background:var(--theme-blue); color:#fff; border:0; padding:10px 20px; border-radius:6px; cursor:pointer; font-weight:800; white-space:nowrap; }
        .btn-red { background:var(--theme-red); color:#fff; }
        .actions { display:flex; justify-content:flex-end; margin-top:20px; }
        .flow { display:flex; flex-direction:column; gap:18px; }
        .flow-row { display:grid; grid-template-columns:88px minmax(240px,33.333%) 120px minmax(220px,1fr); gap:10px; align-items:center; }
        .flow-row button { width:100%; }
        .flow-row input[readonly] { background:#f8fafc; }
        .status-text { color:var(--theme-green); font-weight:800; min-height:20px; }
        .hint { color:var(--text-muted); line-height:1.7; margin:12px 0 0; }
        .progress-wrap { grid-column:2 / 4; height:8px; border-radius:999px; background:#e8eef7; overflow:hidden; display:none; }
        .progress-wrap.active { display:block; }
        .progress-bar { height:100%; width:0; background:var(--theme-blue); transition:width .15s linear; }
        .toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#fff; color:#13BB8A; padding:12px 20px; border:1px solid #b9eadb; border-radius:8px; box-shadow:0 14px 34px rgba(15,65,55,.18); opacity:0; pointer-events:none; font-weight:800; z-index:1001; transition:opacity .3s ease; }
        .toast.show { opacity:1; }
        .page-lock { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(3,7,18,.64); z-index:1000; }
        .page-lock.active { display:flex; }
        .page-lock-box { min-width:170px; padding:20px 24px; display:flex; align-items:center; justify-content:center; gap:12px; background:#fff; border:1px solid var(--border-color); border-radius:8px; box-shadow:0 18px 42px rgba(0,0,0,.35); font-weight:800; }
        .spinner { width:28px; height:28px; border:3px solid #dbe6f5; border-top-color:var(--theme-blue); border-radius:50%; animation:spin .8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .modal-layer { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(3,7,18,.64); z-index:1002; }
        .modal-layer.active { display:flex; }
        .modal-box { width:min(820px,92vw); max-height:82vh; background:#fff; border:1px solid var(--border-color); border-radius:10px; padding:20px; box-shadow:0 18px 42px rgba(0,0,0,.35); display:flex; flex-direction:column; gap:14px; }
        .path-row { display:flex; gap:10px; align-items:center; color:var(--text-muted); font-weight:700; }
        .file-list { border:1px solid var(--border-color); border-radius:8px; overflow:auto; max-height:52vh; }
        .file-item { display:grid; grid-template-columns:28px 1fr 110px; gap:12px; padding:10px 12px; border-bottom:1px solid var(--border-color); cursor:pointer; align-items:center; }
        .file-item:hover { background:#f3f6fb; }
        .file-item:last-child { border-bottom:0; }
        .file-size { color:var(--text-muted); text-align:right; }
        @media (max-width:900px) {
            .form-grid { grid-template-columns:1fr; }
            .flow-row { grid-template-columns:1fr; }
            .progress-wrap { grid-column:auto; }
        }
    </style>
</head>
<body>
    <div id="toast" class="toast">操作成功</div>
    <div id="pageLock" class="page-lock"><div class="page-lock-box"><div class="spinner"></div><div class="lock-text">请稍后</div></div></div>
    <div id="fileModal" class="modal-layer">
        <div class="modal-box">
            <div class="card-header"><h2>选择下载文件</h2><button onclick="closeFileModal()">关闭</button></div>
            <div class="path-row"><button onclick="loadDir('/')">根目录</button><span id="currentPath">/</span></div>
            <div id="fileList" class="file-list"></div>
        </div>
    </div>
    <input id="uploadInput" type="file" style="display:none" onchange="selectUploadFile(this.files[0])">
    <input id="firmwareInput" type="file" style="display:none" onchange="selectFirmwareFile(this.files[0])">

    <div class="container">
        <h1>基础配置</h1>
        <div class="stack">
            <div class="card">
                <div class="card-header"><h2>RTTY远程</h2></div>
                <div class="form-grid">
                    <div class="form-group"><label>ID</label><input id="rtty_id" placeholder="Default"></div>
                    <div class="form-group"><label>描述</label><input id="rtty_description" placeholder="SWITCH_Z8119AX"></div>
                    <div class="form-group"><label>服务器</label><input id="rtty_host" placeholder="rtty.switch-net.com"></div>
                    <div class="form-group"><label>端口</label><input id="rtty_port" type="number" min="1" max="65535" placeholder="5912"></div>
                    <div class="form-group"><label>Token</label><input id="rtty_token" placeholder="switch-net.com"></div>
                </div>
                <div class="actions"><button onclick="saveRtty()">保存 & 应用</button></div>
            </div>

            <div class="card">
                <div class="card-header"><h2>Zabbix Agent</h2></div>
                <div class="form-grid">
                    <div class="form-group"><label>Hostname</label><input id="zbx_hostname" placeholder="CPE-Default"></div>
                    <div class="form-group"><label>Server</label><input id="zbx_server" placeholder="zabbix.switch-net.com"></div>
                    <div class="form-group"><label>ServerActive</label><input id="zbx_serveractive" placeholder="zabbix.switch-net.com"></div>
                </div>
                <div class="actions"><button onclick="saveZabbix()">保存 & 应用</button></div>
            </div>

            <div class="card">
                <div class="card-header"><h2>文件上传和下载</h2></div>
                <div class="flow">
                    <div class="flow-row">
                        <button onclick="document.getElementById('uploadInput').click()">浏览</button>
                        <input id="uploadName" readonly placeholder="请选择本地文件">
                        <button onclick="uploadSelectedFile()">上传文件</button>
                        <span id="uploadStatus" class="status-text"></span>
                        <div id="uploadProgress" class="progress-wrap"><div class="progress-bar"></div></div>
                    </div>
                    <div class="flow-row">
                        <button onclick="openFileModal()">浏览</button>
                        <input id="downloadName" readonly placeholder="请选择 OpenWrt 文件">
                        <button onclick="downloadSelectedFile()">下载文件</button>
                        <span id="downloadStatus" class="status-text"></span>
                        <div id="downloadProgress" class="progress-wrap"><div class="progress-bar"></div></div>
                    </div>
                </div>
                <p class="hint">上传默认保存到 OpenWrt 的 /tmp 目录；下载可从根目录开始逐级浏览选择文件。</p>
            </div>

            <div class="card">
                <div class="card-header"><h2>系统升级</h2></div>
                <div class="flow">
                    <div class="flow-row">
                        <button onclick="document.getElementById('firmwareInput').click()">浏览</button>
                        <input id="firmwareName" readonly placeholder="请选择固件文件">
                        <button onclick="uploadFirmwareFile()">上传固件</button>
                        <span id="firmwareStatus" class="status-text"></span>
                        <div id="firmwareProgress" class="progress-wrap"><div class="progress-bar"></div></div>
                    </div>
                    <div class="flow-row">
                        <span></span>
                        <label><input id="keepConfig" type="checkbox"> 保留配置</label>
                        <button class="btn-red" onclick="confirmUpgrade()">确认升级</button>
                        <span id="upgradeStatus" class="status-text"></span>
                    </div>
                </div>
                <p class="hint">未勾选“保留配置”时执行 sysupgrade -F -n；勾选后执行 sysupgrade -F。升级会中断设备服务，请确认固件正确。</p>
            </div>
        </div>
    </div>
    <script>
        const rawFetch = window.fetch.bind(window);
        let selectedUploadFile = null;
        let selectedFirmwareFile = null;
        let selectedDownloadPath = '';
        let uploadedFirmwarePath = '';
        window.fetch = (url, opts = {}) => {
            const token = localStorage.getItem("cpe_token");
            opts.headers = Object.assign({}, opts.headers || {}, token ? {"X-CPE-Token": token} : {});
            if (token && typeof url === 'string' && url.indexOf('/cgi-bin/') === 0 && url.indexOf('_cpe_token=') === -1) {
                url += (url.indexOf('?') === -1 ? '?' : '&') + '_cpe_token=' + encodeURIComponent(token);
            }
            return rawFetch(url, opts);
        };
        if (localStorage.getItem("cpe_role") !== "admin") {
            document.body.innerHTML = "<h2 style='text-align:center;margin-top:50px;'>无权限访问</h2>";
            throw new Error("Auth err");
        }
        init();
        async function init() {
            const res = await fetch('/cgi-bin/cpe_api.sh?action=get_basic');
            const json = await res.json();
            if (json.msg === 'unauthorized') return handleSessionExpired();
            if (json.status === 'ok') {
                document.getElementById('rtty_id').value = json.rtty.id || 'Default';
                document.getElementById('rtty_description').value = json.rtty.description || 'SWITCH_Z8119AX';
                document.getElementById('rtty_host').value = json.rtty.host || 'rtty.switch-net.com';
                document.getElementById('rtty_port').value = json.rtty.port || '5912';
                document.getElementById('rtty_token').value = json.rtty.token || 'switch-net.com';
                document.getElementById('zbx_hostname').value = json.zabbix.Hostname || 'CPE-Default';
                document.getElementById('zbx_server').value = json.zabbix.Server || 'zabbix.switch-net.com';
                document.getElementById('zbx_serveractive').value = json.zabbix.ServerActive || 'zabbix.switch-net.com';
            }
        }
        function value(id) { return document.getElementById(id).value.trim(); }
        async function saveRtty() {
            const port = value('rtty_port');
            if (!/^[0-9]{1,5}$/.test(port) || Number(port) < 1 || Number(port) > 65535) return alert('RTTY端口必须为 1-65535');
            if (!value('rtty_id') || !value('rtty_host') || !value('rtty_token')) return alert('请填写完整 RTTY 配置');
            await postForm('set_rtty', new URLSearchParams({
                rtty_id:value('rtty_id'), rtty_description:value('rtty_description'), rtty_host:value('rtty_host'), rtty_port:port, rtty_token:value('rtty_token')
            }), 'RTTY配置已保存并应用');
        }
        async function saveZabbix() {
            if (!value('zbx_hostname') || !value('zbx_server') || !value('zbx_serveractive')) return alert('请填写完整 Zabbix 配置');
            await postForm('set_zabbix', new URLSearchParams({
                zbx_hostname:value('zbx_hostname'), zbx_server:value('zbx_server'), zbx_serveractive:value('zbx_serveractive')
            }), 'Zabbix配置已保存并应用');
        }
        async function postForm(action, body, okMsg) {
            setBusy(true, '请稍后');
            try {
                const res = await fetch('/cgi-bin/cpe_api.sh?action=' + action, { method:'POST', body: body.toString() });
                const json = await res.json();
                if (json.status === 'ok') showToast(okMsg);
                else alert(json.msg || '保存失败');
            } finally {
                setBusy(false);
            }
        }
        function selectUploadFile(file) {
            selectedUploadFile = file || null;
            document.getElementById('uploadName').value = file ? file.name : '';
            document.getElementById('uploadStatus').textContent = '';
            resetProgress('uploadProgress');
        }
        function selectFirmwareFile(file) {
            selectedFirmwareFile = file || null;
            uploadedFirmwarePath = '';
            document.getElementById('firmwareName').value = file ? file.name : '';
            document.getElementById('firmwareStatus').textContent = '';
            resetProgress('firmwareProgress');
        }
        function uploadSelectedFile() {
            if (!selectedUploadFile) return alert('请先浏览选择本地文件');
            uploadWithProgress(selectedUploadFile, 'uploadProgress', 'uploadStatus', path => {
                document.getElementById('uploadStatus').textContent = '已上传到 ' + path;
            });
        }
        function uploadFirmwareFile() {
            if (!selectedFirmwareFile) return alert('请先浏览选择固件文件');
            uploadWithProgress(selectedFirmwareFile, 'firmwareProgress', 'firmwareStatus', path => {
                uploadedFirmwarePath = path;
                document.getElementById('firmwareStatus').textContent = '固件已上传到 ' + path;
            });
        }
        function uploadWithProgress(file, progressId, statusId, done) {
            const token = localStorage.getItem("cpe_token") || '';
            const xhr = new XMLHttpRequest();
            const progress = document.getElementById(progressId);
            const bar = progress.querySelector('.progress-bar');
            document.getElementById(statusId).textContent = '';
            progress.classList.add('active');
            bar.style.width = '0%';
            xhr.upload.onprogress = e => {
                if (e.lengthComputable) bar.style.width = Math.round(e.loaded * 100 / e.total) + '%';
            };
            xhr.onload = () => {
                try {
                    const json = JSON.parse(xhr.responseText || '{}');
                    if (json.status === 'ok') {
                        bar.style.width = '100%';
                        done(json.path);
                    } else {
                        document.getElementById(statusId).textContent = json.msg || '上传失败';
                    }
                } catch (e) {
                    document.getElementById(statusId).textContent = '上传失败';
                }
            };
            xhr.onerror = () => { document.getElementById(statusId).textContent = '上传失败'; };
            xhr.open('POST', '/cgi-bin/cpe_api.sh?action=upload_file&name=' + encodeURIComponent(file.name) + '&_cpe_token=' + encodeURIComponent(token));
            xhr.setRequestHeader('X-CPE-Token', token);
            xhr.send(file);
        }
        function openFileModal() {
            document.getElementById('fileModal').classList.add('active');
            loadDir('/');
        }
        function closeFileModal() {
            document.getElementById('fileModal').classList.remove('active');
        }
        async function loadDir(path) {
            setBusy(true, '请稍后');
            try {
                const res = await fetch('/cgi-bin/cpe_api.sh?action=list_dir&path=' + encodeURIComponent(path));
                const json = await res.json();
                if (json.msg === 'unauthorized') return handleSessionExpired();
                if (json.status !== 'ok') throw new Error(json.msg || '目录加载失败');
                document.getElementById('currentPath').textContent = json.path;
                const parent = json.path === '/' ? '' : json.path.replace(/\/+$/, '').replace(/\/[^/]*$/, '') || '/';
                const rows = [];
                if (parent) rows.push(`<div class="file-item" onclick="loadDir('${escapeJs(parent)}')"><div>↩</div><div>上级目录</div><div class="file-size"></div></div>`);
                (json.items || []).forEach(item => {
                    const icon = item.type === 'dir' ? 'DIR' : 'FILE';
                    const action = item.type === 'dir' ? `loadDir('${escapeJs(item.path)}')` : `selectDownloadFile('${escapeJs(item.path)}')`;
                    rows.push(`<div class="file-item" onclick="${action}"><div>${icon}</div><div>${escapeHtml(item.name)}</div><div class="file-size">${item.type === 'file' ? formatSize(Number(item.size || 0)) : ''}</div></div>`);
                });
                document.getElementById('fileList').innerHTML = rows.join('') || '<div class="file-item"><div></div><div>目录为空</div><div></div></div>';
            } catch (e) {
                alert(e.message || '目录加载失败');
            } finally {
                setBusy(false);
            }
        }
        function selectDownloadFile(path) {
            selectedDownloadPath = path;
            document.getElementById('downloadName').value = path;
            document.getElementById('downloadStatus').textContent = '';
            resetProgress('downloadProgress');
            closeFileModal();
        }
        function downloadSelectedFile() {
            if (!selectedDownloadPath) return alert('请先浏览选择 OpenWrt 文件');
            const token = localStorage.getItem("cpe_token") || '';
            const xhr = new XMLHttpRequest();
            const progress = document.getElementById('downloadProgress');
            const bar = progress.querySelector('.progress-bar');
            progress.classList.add('active');
            bar.style.width = '0%';
            document.getElementById('downloadStatus').textContent = '';
            xhr.onprogress = e => {
                if (e.lengthComputable) bar.style.width = Math.round(e.loaded * 100 / e.total) + '%';
            };
            xhr.onload = () => {
                if (xhr.status >= 200 && xhr.status < 300) {
                    bar.style.width = '100%';
                    const blob = xhr.response;
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = selectedDownloadPath.split('/').pop() || 'download.bin';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
                    document.getElementById('downloadStatus').textContent = '文件已开始下载';
                } else {
                    document.getElementById('downloadStatus').textContent = '下载失败';
                }
            };
            xhr.onerror = () => { document.getElementById('downloadStatus').textContent = '下载失败'; };
            xhr.open('GET', '/cgi-bin/cpe_api.sh?action=download_file&file=' + encodeURIComponent(selectedDownloadPath) + '&_cpe_token=' + encodeURIComponent(token));
            xhr.responseType = 'blob';
            xhr.setRequestHeader('X-CPE-Token', token);
            xhr.send();
        }
        async function confirmUpgrade() {
            if (!uploadedFirmwarePath) return alert('请先上传固件');
            const keep = document.getElementById('keepConfig').checked;
            const cmd = keep ? `sysupgrade -F ${uploadedFirmwarePath}` : `sysupgrade -F -n ${uploadedFirmwarePath}`;
            if (!confirm(`确认执行系统升级吗？\n${cmd}`)) return;
            document.getElementById('upgradeStatus').textContent = '';
            setBusy(true, '请稍后');
            try {
                const body = `file=${encodeURIComponent(uploadedFirmwarePath)}&keep=${keep ? '1' : '0'}`;
                const res = await fetch('/cgi-bin/cpe_api.sh?action=sysupgrade_firmware', { method:'POST', body });
                const json = await res.json();
                document.getElementById('upgradeStatus').textContent = json.status === 'ok' ? '已执行系统升级命令' : (json.msg || '执行失败');
            } finally {
                setBusy(false);
            }
        }
        function handleSessionExpired() {
            alert('请重新登录');
            localStorage.removeItem('cpe_auth');
            localStorage.removeItem('cpe_role');
            localStorage.removeItem('cpe_token');
            window.top.location.reload();
        }
        function setBusy(active, text) {
            const lock = document.getElementById('pageLock');
            if (text) lock.querySelector('.lock-text').textContent = text;
            lock.classList.toggle('active', !!active);
        }
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg || '操作成功';
            t.classList.add('show');
            clearTimeout(showToast.timer);
            showToast.timer = setTimeout(() => t.classList.remove('show'), 2200);
        }
        function resetProgress(id) {
            const p = document.getElementById(id);
            p.classList.remove('active');
            p.querySelector('.progress-bar').style.width = '0%';
        }
        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
        function escapeJs(s) {
            return String(s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }
        function formatSize(n) {
            if (n > 1048576) return (n / 1048576).toFixed(1) + ' MB';
            if (n > 1024) return (n / 1024).toFixed(1) + ' KB';
            return n + ' B';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/cpe/assets/favicon.png">
    <title>SDWAN隧道</title>
    <style>
        :root { --bg-main:#f3f6fb; --bg-card:#fff; --border-color:#dfe7f3; --text-main:#071b3a; --text-muted:#64748b; --theme-blue:#3568b7; --theme-green:#18a178; --theme-red:#d94a38; }
        body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg-main); color:var(--text-main); padding:30px; margin:0; }
        .container { width:100%; margin:0 auto; } h1 { margin:0 0 24px; font-size:1.8rem; }
        .stack { display:flex; flex-direction:column; gap:22px; } .card { background:var(--bg-card); border:1px solid var(--border-color); border-radius:12px; padding:24px; box-shadow:0 12px 30px rgba(29,53,87,.08); }
        .card-header, .section-header { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:20px; border-bottom:1px solid var(--border-color); padding-bottom:15px; }
        h2, h3 { margin:0; color:var(--theme-blue); } h2 { font-size:1.2rem; } h3 { font-size:1rem; }
        .form-grid { display:grid; grid-template-columns:repeat(5,minmax(150px,1fr)); gap:16px; align-items:end; }
        .form-group { display:flex; flex-direction:column; gap:8px; } label { color:var(--text-muted); font-size:.9rem; font-weight:600; }
        input, select { width:100%; background:#fff; border:1px solid var(--border-color); color:var(--text-main); padding:10px; border-radius:6px; box-sizing:border-box; font-size:.95rem; min-width:0; }
        input:focus, select:focus { border-color:var(--theme-blue); outline:none; }
        .muted { color:var(--text-muted); font-size:.9rem; } .account-note { margin:16px 0 0; padding:12px 14px; background:#f7faff; border:1px solid #e1eaf6; color:#52627a; border-radius:6px; }
        .actions { display:flex; justify-content:flex-end; margin-top:20px; gap:10px; } button { background:var(--theme-blue); color:#fff; border:0; padding:9px 16px; border-radius:6px; cursor:pointer; font-weight:800; }
        button.secondary { background:#eaf1fb; color:var(--theme-blue); } button.danger { background:var(--theme-red); color:#fff; } button.small { padding:7px 10px; font-size:.85rem; }
        .password-wrap { display:flex; align-items:center; gap:6px; } .password-wrap input { flex:1; } .eye-toggle { position:relative; flex:0 0 34px; width:34px; height:34px; padding:0; color:var(--theme-blue); background:#eaf1fb; font-size:16px; line-height:1; }
        .eye-toggle.hidden::after { content:""; position:absolute; left:6px; top:16px; width:21px; height:2px; background:var(--theme-red); transform:rotate(-42deg); }
        .server-block { margin-top:22px; padding-top:20px; border-top:1px solid var(--border-color); } .table-wrap { overflow:auto; border:1px solid var(--border-color); border-radius:8px; }
        table { border-collapse:collapse; width:100%; min-width:860px; } th, td { padding:12px 14px; text-align:left; border-bottom:1px solid var(--border-color); vertical-align:middle; } th { color:var(--text-muted); font-size:.82rem; font-weight:800; background:#f8fbff; } tr:last-child td { border-bottom:0; }
        .account-table input { min-width:130px; } .row-actions { display:flex; gap:8px; white-space:nowrap; } .status { display:inline-block; padding:4px 9px; border-radius:999px; font-size:.8rem; font-weight:800; } .status.enabled { background:#e5f7f0; color:#13BB8A; } .status.disabled { background:#fff0ed; color:var(--theme-red); }
        .sessions { margin-top:22px; background:#fff; border:1px solid var(--border-color); border-radius:10px; overflow:hidden; color:var(--text-main); } .sessions .section-header { padding:18px 20px; margin:0; border-color:var(--border-color); } .sessions h3 { color:var(--theme-blue); }
        .sessions table { min-width:900px; } .sessions th { color:var(--text-muted); background:#f8fbff; border-color:var(--border-color); } .sessions td { border-color:var(--border-color); font-weight:600; } .sessions .empty { padding:22px; color:var(--text-muted); text-align:center; }
        .transfer-down { color:#32c477; } .transfer-up { color:#52a7ff; } .toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#fff; color:#13BB8A; padding:12px 20px; border:1px solid #b9eadb; border-radius:8px; box-shadow:0 14px 34px rgba(15,65,55,.18); opacity:0; pointer-events:none; font-weight:800; z-index:1001; transition:opacity .3s ease; } .toast.show { opacity:1; }
        .page-lock, .modal-layer { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(3,7,18,.64); } .page-lock { z-index:1000; } .modal-layer { z-index:1002; } .page-lock.active, .modal-layer.active { display:flex; }
        .page-lock-box, .modal-box { background:#fff; border:1px solid var(--border-color); border-radius:8px; box-shadow:0 18px 42px rgba(0,0,0,.35); } .page-lock-box { min-width:170px; padding:20px 24px; display:flex; align-items:center; justify-content:center; gap:12px; font-weight:800; }
        .modal-box { width:min(420px,calc(100vw - 36px)); padding:24px; } .modal-box h2 { margin-bottom:18px; } .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
        .spinner { width:28px; height:28px; border:3px solid #dbe6f5; border-top-color:var(--theme-blue); border-radius:50%; animation:spin .8s linear infinite; } @keyframes spin { to { transform:rotate(360deg); } }
        @media (max-width:1000px) { .form-grid { grid-template-columns:repeat(2,minmax(160px,1fr)); } } @media (max-width:620px) { body { padding:18px; } .form-grid { grid-template-columns:1fr; } .card-header, .section-header { align-items:flex-start; flex-direction:column; } }
    </style>
</head>
<body>
    <div id="toast" class="toast">配置已保存并应用</div>
    <div id="pageLock" class="page-lock"><div class="page-lock-box"><div class="spinner"></div><div class="lock-text">请稍后</div></div></div>
    <div id="serverAccountModal" class="modal-layer"><div class="modal-box"><h2>新增账号密码</h2><div class="form-group"><label>账号</label><input id="serverAccountUser" autocomplete="off" maxlength="64"></div><div class="form-group" style="margin-top:16px"><label>密码</label><div class="password-wrap"><input id="serverAccountPass" type="password" autocomplete="new-password" maxlength="128"><button class="eye-toggle hidden" type="button" title="显示密码" aria-label="显示密码" onclick="togglePassword('serverAccountPass', this)">◉</button></div></div><div class="modal-actions"><button class="secondary" onclick="closeServerAccountModal()">取消</button><button onclick="addServerAccount()">确定</button></div></div></div>
    <div id="confirmLayer" class="modal-layer"><div class="modal-box"><h2>确认操作</h2><p id="confirmText" class="muted"></p><div class="modal-actions"><button class="secondary" onclick="resolveConfirm(false)">取消</button><button class="danger" onclick="resolveConfirm(true)">确定</button></div></div></div>
    <div class="container"><h1>SDWAN隧道</h1><div class="stack"><div id="tunnelContainer"></div><div class="card"><div class="actions" style="margin-top:0"><button onclick="saveOpenvpn()">保存 &amp; 应用</button></div></div></div></div>
    <script>
        const rawFetch = window.fetch.bind(window); let tunnels = []; let serverAccounts = []; let onlineSessions = []; let confirmResolver = null;
        window.fetch = (url, opts = {}) => { const token = localStorage.getItem('cpe_token'); opts.headers = Object.assign({}, opts.headers || {}, token ? {'X-CPE-Token':token} : {}); if (token && typeof url === 'string' && url.indexOf('/cgi-bin/') === 0 && url.indexOf('_cpe_token=') === -1) url += (url.indexOf('?') === -1 ? '?' : '&') + '_cpe_token=' + encodeURIComponent(token); return rawFetch(url, opts); };
        if (localStorage.getItem('cpe_role') !== 'admin') { document.body.innerHTML = '<h2 style="text-align:center;margin-top:50px;">无权限访问</h2>'; throw new Error('Auth err'); }
        init();
        async function init() { setBusy(true, '请稍后'); try { const res = await fetch('/cgi-bin/cpe_api.sh?action=get_openvpn'); const json = await res.json(); if (json.msg === 'unauthorized') return handleSessionExpired(); if (json.status !== 'ok') throw new Error(json.msg || '加载失败'); tunnels = json.tunnels || []; serverAccounts = json.server_accounts || []; onlineSessions = json.online_sessions || []; renderTunnels(); } catch (e) { alert(e.message || '加载失败'); } finally { setBusy(false); } }
        function renderTunnels() { const box = document.getElementById('tunnelContainer'); if (!tunnels.length) { box.innerHTML = '<div class="card"><div class="card-header"><h2>隧道配置</h2></div><p class="muted">未读取到 /etc/config/openvpn 中的隧道配置段。</p></div>'; return; } box.innerHTML = tunnels.map((t, i) => renderTunnel(t, i)).join(''); tunnels.forEach((t, i) => { document.getElementById(`enabled-${i}`).value = t.enabled || '0'; document.getElementById(`endpoint-${i}`).value = t.remote || (t.kind === 'server' ? '0.0.0.0' : 'ovpn.switch-net.com'); document.getElementById(`port-${i}`).value = t.port || '1199'; }); }
        function renderTunnel(t, i) { const isClient = t.kind === 'client'; const isServer = t.kind === 'server'; const endpointLabel = isServer ? 'local' : 'remote'; const clientFields = isClient ? `<div class="form-group"><label>账号</label><input id="auth-user-${i}" value="${escapeAttr(t.user)}" autocomplete="off"></div><div class="form-group"><label>密码</label><div class="password-wrap"><input id="auth-pass-${i}" type="password" value="${escapeAttr(t.pass)}" autocomplete="new-password"><button class="eye-toggle hidden" type="button" title="显示密码" aria-label="显示密码" onclick="togglePassword('auth-pass-${i}', this)">◉</button></div></div>` : ''; const clientNote = isClient ? `<div class="account-note">账号文件：${escapeHtml(t.auth_file || '未配置 auth_user_pass')}</div>` : ''; const serverBlock = isServer ? renderServerBlock() : ''; return `<div class="card"><div class="card-header"><h2>${escapeHtml(t.section)}</h2><span class="muted">/etc/config/openvpn</span></div><div class="form-grid"><div class="form-group"><label>enabled</label><select id="enabled-${i}"><option value="0">0 - 禁用</option><option value="1">1 - 启用</option></select></div><div class="form-group"><label>${endpointLabel}</label><input id="endpoint-${i}" placeholder="${isServer ? '0.0.0.0' : 'ovpn.switch-net.com'}"></div><div class="form-group"><label>port</label><input id="port-${i}" type="number" min="1" max="65535" placeholder="1199"></div>${clientFields}</div>${clientNote}${serverBlock}</div>`; }
        function renderServerBlock() { const accounts = serverAccounts.length ? serverAccounts.map((a, i) => `<tr><td><input id="server-user-${i}" value="${escapeAttr(a.user)}" maxlength="64"></td><td><div class="password-wrap"><input id="server-pass-${i}" type="password" value="${escapeAttr(a.pass)}" maxlength="128"><button class="eye-toggle hidden" type="button" title="显示密码" aria-label="显示密码" onclick="togglePassword('server-pass-${i}', this)">◉</button></div></td><td><span class="status ${a.disabled === '1' ? 'disabled' : 'enabled'}">${a.disabled === '1' ? '已禁用' : '已启用'}</span></td><td><div class="row-actions"><button class="small" onclick="saveServerAccount(${i}, '${escapeJs(a.user)}')">修改</button><button class="small danger" onclick="deleteServerAccount('${escapeJs(a.user)}')">删除</button><button class="small secondary" onclick="toggleServerAccount('${escapeJs(a.user)}')">${a.disabled === '1' ? '启用' : '禁用'}</button></div></td></tr>`).join('') : '<tr><td colspan="4" class="muted">暂无 Server 账号</td></tr>'; return `<div class="server-block"><div class="section-header"><h3>Server账号管理</h3><button onclick="openServerAccountModal()">新增账号密码</button></div><div class="table-wrap"><table class="account-table"><thead><tr><th>账号</th><th>密码</th><th>状态</th><th>操作</th></tr></thead><tbody>${accounts}</tbody></table></div>${renderSessions()}</div>`; }
        function renderSessions() { const rows = onlineSessions.length ? onlineSessions.map(s => `<tr><td>${escapeHtml(s.common_name)}</td><td>${escapeHtml(s.virtual_ip || '-')}</td><td>${escapeHtml(s.real_address || '-')}</td><td><div class="transfer-down">↓ ${formatBytes(s.bytes_received)}</div><div class="transfer-up">↑ ${formatBytes(s.bytes_sent)}</div></td><td>${escapeHtml(s.connected_since || '-')}</td></tr>`).join('') : '<tr><td colspan="5" class="empty">当前没有在线用户</td></tr>'; return `<div class="sessions"><div class="section-header"><h3>在线用户</h3><button onclick="init()">刷新</button></div><div class="table-wrap"><table><thead><tr><th>用户名</th><th>虚拟 IP</th><th>真实地址</th><th>数据传输</th><th>连接时间</th></tr></thead><tbody>${rows}</tbody></table></div></div>`; }
        async function saveOpenvpn() { const params = new URLSearchParams(); params.set('count', String(tunnels.length)); for (let i = 0; i < tunnels.length; i++) { const t = tunnels[i]; const endpoint = document.getElementById(`endpoint-${i}`).value.trim() || (t.kind === 'server' ? '0.0.0.0' : 'ovpn.switch-net.com'); const port = document.getElementById(`port-${i}`).value.trim() || '1199'; if (!/^[0-9]{1,5}$/.test(port) || Number(port) < 1 || Number(port) > 65535) return alert(`${t.section} 的端口必须为 1-65535`); params.set(`sec_${i}`, t.section); params.set(`enabled_${i}`, document.getElementById(`enabled-${i}`).value); params.set(`remote_${i}`, endpoint); params.set(`port_${i}`, port); if (t.kind === 'client') { params.set(`auth_user_${i}`, document.getElementById(`auth-user-${i}`).value.trim()); params.set(`auth_pass_${i}`, document.getElementById(`auth-pass-${i}`).value); } } setBusy(true, '请稍后'); try { const res = await fetch('/cgi-bin/cpe_api.sh?action=set_openvpn', {method:'POST', body:params.toString()}); const json = await res.json(); if (json.status === 'ok') showToast('SDWAN隧道配置已保存并应用'); else alert(json.msg || '保存失败'); } catch (e) { alert(e.message || '保存失败'); } finally { setBusy(false); } }
        function openServerAccountModal() { document.getElementById('serverAccountUser').value = ''; document.getElementById('serverAccountPass').value = ''; document.getElementById('serverAccountModal').classList.add('active'); }
        function closeServerAccountModal() { document.getElementById('serverAccountModal').classList.remove('active'); }
        async function addServerAccount() { const user = document.getElementById('serverAccountUser').value.trim(); const pass = document.getElementById('serverAccountPass').value; if (!user || !pass) return alert('请填写账号和密码'); closeServerAccountModal(); await postAccountAction('add_openvpn_server_account', {user, pass}, '账号密码已新增'); }
        async function saveServerAccount(index, oldUser) { const user = document.getElementById(`server-user-${index}`).value.trim(); const pass = document.getElementById(`server-pass-${index}`).value; if (!user || !pass) return alert('请填写账号和密码'); await postAccountAction('save_openvpn_server_account', {old_user:oldUser, user, pass}, '账号密码已修改'); }
        async function deleteServerAccount(user) { if (!(await confirmAction(`确定删除账号 ${user} 吗？`))) return; await postAccountAction('delete_openvpn_server_account', {user}, '账号已删除'); }
        async function toggleServerAccount(user) { await postAccountAction('toggle_openvpn_server_account', {user}, '账号状态已更新'); }
        async function postAccountAction(action, values, message) { setBusy(true, '请稍后'); try { const res = await fetch('/cgi-bin/cpe_api.sh?action=' + action, {method:'POST', body:new URLSearchParams(values).toString()}); const json = await res.json(); if (json.status === 'ok') { await init(); showToast(message); } else alert(json.msg || '操作失败'); } catch (e) { alert(e.message || '操作失败'); } finally { setBusy(false); } }
        function togglePassword(id, button) { const input = document.getElementById(id); const hidden = input.type === 'password'; input.type = hidden ? 'text' : 'password'; button.classList.toggle('hidden', !hidden); button.title = hidden ? '隐藏密码' : '显示密码'; button.setAttribute('aria-label', button.title); }
        function confirmAction(text) { document.getElementById('confirmText').textContent = text; document.getElementById('confirmLayer').classList.add('active'); return new Promise(resolve => { confirmResolver = resolve; }); }
        function resolveConfirm(ok) { document.getElementById('confirmLayer').classList.remove('active'); if (confirmResolver) confirmResolver(!!ok); confirmResolver = null; }
        function formatBytes(value) { const n = Number(value) || 0; if (n >= 1024 * 1024 * 1024) return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB'; if (n >= 1024 * 1024) return (n / 1024 / 1024).toFixed(2) + ' MB'; if (n >= 1024) return (n / 1024).toFixed(2) + ' KB'; return n + ' B'; }
        function handleSessionExpired() { alert('请重新登录'); localStorage.removeItem('cpe_auth'); localStorage.removeItem('cpe_role'); localStorage.removeItem('cpe_token'); window.top.location.reload(); }
        function setBusy(active, text) { const lock = document.getElementById('pageLock'); if (text) lock.querySelector('.lock-text').textContent = text; lock.classList.toggle('active', !!active); }
        function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg || '配置已保存并应用'; t.classList.add('show'); clearTimeout(showToast.timer); showToast.timer = setTimeout(() => t.classList.remove('show'), 2200); }
        function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); } function escapeAttr(s) { return escapeHtml(s); } function escapeJs(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
    </script>
</body>
</html>
